name: Viewer

# Builds and smoke-tests the web viewer in viewer/ on pull requests, and
# publishes it to GitHub Pages from main. Before the build, with the same
# released ccad as the Validate workflow, it renders the component thumbnails
# that are missing or stale (tools/thumbnails.py) and bakes the pieces the
# components' Lua scripts make (tools/scripted.py), which the viewer's engine
# cannot run; both only go into this build's dist/library/ and are never
# committed back.

on:
  pull_request:
    paths:
      - "viewer/**"
      - "components/**"
      - "catalog.json"
      - "thumbnails/**"
      - "tools/thumbnails.py"
      - "tools/scripted.py"
      - ".github/actions/setup-ccad/**"
      - ".github/workflows/pages.yml"
  push:
    branches: [main]
    paths:
      - "viewer/**"
      - "components/**"
      - "catalog.json"
      - "thumbnails/**"
      - "tools/thumbnails.py"
      - "tools/scripted.py"
      - ".github/actions/setup-ccad/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  # The ConstructCraft release whose ccad renders and bakes, as in validate.yml.
  CONSTRUCTCRAFT_VERSION: latest

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: ./.github/actions/setup-ccad
        with:
          version: ${{ env.CONSTRUCTCRAFT_VERSION }}
      # Renders only the new or stale thumbnails and adds them to catalog.json,
      # for this build only.
      - name: Render the thumbnails
        working-directory: .
        run: python tools/thumbnails.py
      # The pieces Lua scripts make, for the viewer (scripted/, not in git).
      - name: Bake the script pieces
        working-directory: .
        run: python tools/scripted.py
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      # Tests the dist/ built above instead of building again.
      - run: npm run smoke -- --no-build
      - name: Upload smoke screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-screenshots
          path: viewer/.smoke
          if-no-files-found: ignore
          include-hidden-files: true # .smoke/ is a dot directory
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: viewer/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
