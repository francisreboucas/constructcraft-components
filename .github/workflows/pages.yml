name: Viewer

# Builds and smoke-tests the web viewer in viewer/ on pull requests, and
# publishes it to GitHub Pages from main.

on:
  pull_request:
    paths:
      - "viewer/**"
      - "components/**"
      - "catalog.json"
      - ".github/workflows/pages.yml"
  push:
    branches: [main]
    paths:
      - "viewer/**"
      - "components/**"
      - "catalog.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      # Tests the dist/ built above instead of building again.
      - run: npm run smoke -- --no-build
      - name: Upload smoke screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-screenshots
          path: viewer/.smoke
          if-no-files-found: ignore
          include-hidden-files: true # .smoke/ is a dot directory
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: viewer/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
