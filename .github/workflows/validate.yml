name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # The ConstructCraft release whose ccad checks the components: a tag such as
  # v0.13.0, or latest (never older than 0.13; see .github/actions/setup-ccad).
  CONSTRUCTCRAFT_VERSION: latest

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: ./.github/actions/setup-ccad
        with:
          version: ${{ env.CONSTRUCTCRAFT_VERSION }}
      - run: python tools/build.py --check
